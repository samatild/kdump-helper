[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdump-helper"
version = "0.1.0"
description = "Prepare a Linux system (RHEL/Ubuntu/Debian/SLES) for kdump analysis with automatic debug symbol fetching"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Samuel Matildes" }
]
license = { file = "LICENSE" }
keywords = [
    "kdump", "kexec", "crash", "kernel", "debug", "vmcore", 
    "debuginfo", "symbols", "analysis", "troubleshooting"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Debuggers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "distro>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/samatild/kdump-helper"
Repository = "https://github.com/samatild/kdump-helper"
Documentation = "https://github.com/samatild/kdump-helper#readme"
"Bug Tracker" = "https://github.com/samatild/kdump-helper/issues"

[project.scripts]
kdump-helper = "kdump_helper.cli:app"

